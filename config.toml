baseURL = "https://rafee.me"
title = "Mohammad Ishfaque Jahan Rafee"
languageCode = "en"
defaultContentLanguage = "en"
theme = "PaperMod"

paginate = 8

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
    style = "github-dark"

[params]
env = "production"
title = "Mohammad Ishfaque Jahan Rafee"
description = "Mohammad Ishfaque Jahan Rafee — Security Engineer specializing in Cloud Security (AWS & OCI), Infrastructure Defense, DFIR, and Security Automation."
keywords = ["Mohammad Ishfaque Jahan Rafee", "rafee-sec", "cybersecurity", "security engineer", "cloud security", "AWS", "OCI", "DFIR", "incident response", "python", "go", "edmonton"]
author = "Mohammad Ishfaque Jahan Rafee"

# Light & Dark Theme Configuration
defaultTheme = "auto"
disableThemeToggle = false

# Reading and Navigation Features
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = true
disableScrollToTop = false

# Profile Landing Page Layout
[params.profileMode]
enabled = true
title = "Mohammad Ishfaque Jahan Rafee"
subtitle = "Security Engineer • Cloud Defense (AWS & OCI) • DFIR • Automation"
imageUrl = "images/me.jpg"
